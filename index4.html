<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Music Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Music Blog</h1>
        <p>Découvrez l'univers de la musique</p>
    </header>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="index2.html">Articles</a>
        <a href="index3.html">Galerie</a>
        <a href="index4.html" class="active">Contact</a>
        <a href="connexion.html">Connexion</a>
    </nav>

    <main>
        <section class="contact-section">
            <h2>Contactez-nous</h2>
            <p class="contact-intro">Une question, une suggestion d'article ou une envie de collaborer ? Écrivez-nous via le formulaire ci-dessous.</p>

            <form action="#" method="POST" class="contact-form">
                <div class="form-group">
                    <label for="name">Votre nom</label>
                    <input type="text" id="name" name="name" placeholder="Ex: Jean Dupont" required>
                </div>

                <div class="form-group">
                    <label for="email">Votre adresse e-mail</label>
                    <input type="email" id="email" name="email" placeholder="Ex: jean.dupont@email.com" required>
                </div>

                <div class="form-group">
                    <label for="subject">Sujet</label>
                    <input type="text" id="subject" name="subject" placeholder="Ex: Proposition d'article sur le Jazz" required>
                </div>

                <div class="form-group">
                    <label for="message">Votre message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Écrivez votre message ici..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Envoyer le message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Music Blog - Tous droits réservés.</p>
    </footer>

</body>
</html>
