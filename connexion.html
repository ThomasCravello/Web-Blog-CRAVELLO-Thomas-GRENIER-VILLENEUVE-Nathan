<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Music Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="parallax">

    <header>
        <h1>Music Blog</h1>
        <p>Découvrez l'univers de la musique électronique</p>
    </header>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="index2.html">Artistes</a>
        <a href="index3.html">Musiques</a>
        <a href="index4.html">Contact</a>
        <a href="connexion.html">Connexion</a>
    </nav>

    <main>
        <section class="login-section">
            <h2>Espace Connexion</h2>

            <form action="#" method="POST" class="login-form">
                <div class="form-group">
                    <label for="email">Adresse e-mail ou nom d'utilisateur</label>
                    <input type="email" id="email" name="email" placeholder="Ex: vinyle@musicblog.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> Se souvenir de moi
                    </label>
                    <a href="#" class="forgot-pwd">Mot de passe oublié ?</a>
                </div>

                <button type="submit" class="btn-submit">Se connecter</button>

                <p class="signup-prompt">
                    Pas encore de compte ? <a href="#">Inscrivez-vous ici</a>
                </p>
            </form>
        </section>
    </main>

</body>
</html>
