<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-fr="Connexion - Music Blog" data-en="Login - Music Blog">Connexion - Music Blog</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body class="parallax">

    <div id="google_translate_element" style="display:none;"></div>

    <header>
        <h1 data-fr="Music Blog" data-en="Music Blog">Music Blog</h1>
        <p data-fr="Découvrez l'univers de la musique électronique" data-en="Discover the world of electronic music">Découvrez l'univers de la musique électronique</p>
    </header>

    <nav>
        <a href="index.html" data-fr="Accueil" data-en="Home">Accueil</a>
        <a href="index2.html" data-fr="Artistes" data-en="Artists">Artistes</a>
        <a href="index3.html" data-fr="Musiques" data-en="Music">Musiques</a>
        <a href="index4.html" data-fr="Contact" data-en="Contact">Contact</a>
        <a href="connexion.html" class="active" data-fr="Connexion" data-en="Login">Connexion</a>
    </nav>

    <main>
        <section class="login-section">
            <h2 data-fr="Espace Connexion" data-en="Login Area">Espace Connexion</h2>

            <form action="#" method="POST" class="login-form">
                <div class="form-group">
                    <label for="email" data-fr="Adresse e-mail ou nom d'utilisateur" data-en="Email address or username">Adresse e-mail ou nom d'utilisateur</label>
                    <input type="email" id="email" name="email" placeholder="Ex: vinyle@musicblog.com" data-fr="Ex: vinyle@musicblog.com" data-en="Ex: vinyl@musicblog.com" required>
                </div>

                <div class="form-group">
                    <label for="password" data-fr="Mot de passe" data-en="Password">Mot de passe</label>
                    <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" data-fr="Entrez votre mot de passe" data-en="Enter your password" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> <span data-fr="Se souvenir de moi" data-en="Remember me">Se souvenir de moi</span>
                    </label>
                    <a href="#" class="forgot-pwd" data-fr="Mot de passe oublié ?" data-en="Forgot password?">Mot de passe oublié ?</a>
                </div>

                <button type="submit" class="btn-submit" data-fr="Se connecter" data-en="Log in">Se connecter</button>

                <p class="signup-prompt">
                    <span data-fr="Pas encore de compte ?" data-en="Don't have an account yet?">Pas encore de compte ?</span> <a href="#" data-fr="Inscrivez-vous ici" data-en="Sign up here">Inscrivez-vous ici</a>
                </p>
            </form>
        </section>
    </main>

    <button id="translateBtn">🇬🇧 English</button>

</body>
</html>
